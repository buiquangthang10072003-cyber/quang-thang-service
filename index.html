<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANG THẮNG SERVICE - Quản Lý Điện Lạnh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Dữ liệu mẫu ban đầu
        const INITIAL_ORDERS = [
            {
                id: "DL000125",
                customerName: "Nguyễn Văn A",
                phone: "0961450862",
                address: "Cát Hưng, Phù Cát, Bình Định",
                gps: "13.9281,109.0521",
                deviceType: "Máy lạnh",
                brand: "Panasonic 1.5 HP",
                issue: "Máy không lạnh, báo lỗi chớp đèn",
                workContent: "Sửa board mạch, vệ sinh, sạc gas R32",
                techAssigned: "Thợ A",
                status: "Đang sửa", // Đã nhận, Đang di chuyển, Đang sửa, Hoàn thành
                laborCost: 300000,
                materialCost: 200000,
                totalAmount: 500000,
                paidAmount: 500000,
                debtAmount: 0,
                date: "2026-09-15",
                materialsUsed: [{ name: "Gas R32", qty: 1, price: 200000 }],
                photos: ["https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=300&q=80"],
                warrantyMonths: 6,
                notes: "Hẹn khách 8h00 sáng"
            },
            {
                id: "DL000126",
                customerName: "Trần Thị B",
                phone: "0988123456",
                address: "TT. Ngô Mây, Phù Cát",
                gps: "13.9500,109.0333",
                deviceType: "Máy giặt",
                brand: "Toshiba 9Kg",
                issue: "Báo lỗi E10, không cấp nước",
                workContent: "Thay van cấp nước đôi",
                techAssigned: "Thợ B",
                status: "Đã nhận",
                laborCost: 200000,
                materialCost: 150000,
                totalAmount: 350000,
                paidAmount: 100000,
                debtAmount: 250000,
                date: "2026-09-15",
                materialsUsed: [{ name: "Tụ điện 35uF", qty: 1, price: 150000 }],
                photos: [],
                warrantyMonths: 3,
                notes: "Khách nợ 250k hẹn cuối tuần trả"
            }
        ];

        const INITIAL_INVENTORY = [
            { id: 1, name: "Gas R32", unit: "Kg", stock: 15, minStock: 5, importPrice: 100000, sellPrice: 200000 },
            { id: 2, name: "Gas R410A", unit: "Kg", stock: 10, minStock: 3, importPrice: 110000, sellPrice: 220000 },
            { id: 3, name: "Tụ điện 35uF", unit: "Cái", stock: 8, minStock: 4, importPrice: 50000, sellPrice: 150000 },
            { id: 4, name: "Ống đồng 10/6", unit: "Mét", stock: 45, minStock: 10, importPrice: 80000, sellPrice: 120000 },
        ];

        const INITIAL_TECHS = [
            { id: 1, name: "Thợ A", phone: "0911222333", username: "thoa", status: "Hoạt động", commissionRate: 30, startDate: "2024-01-15" },
            { id: 2, name: "Thợ B", phone: "0944555666", username: "thob", status: "Hoạt động", commissionRate: 35, startDate: "2024-05-10" },
        ];

        const INITIAL_CASHFLOW = [
            { id: 1, type: "THU", category: "Khách thanh toán", amount: 500000, date: "2026-09-15", note: "Đơn DL000125 - Khách Nguyễn Văn A" },
            { id: 2, type: "CHI", category: "Mua vật tư", amount: 1500000, date: "2026-09-14", note: "Nhập thêm 2 bình Gas R32" },
        ];

        function App() {
            // Role & Auth State
            const [role, setRole] = useState('admin'); // 'admin' hoặc 'tech'
            const [currentTech, setCurrentTech] = useState('Thợ A');

            // Tabs Admin
            const [adminTab, setAdminTab] = useState('dashboard'); // dashboard, orders, techs, inventory, customers, debts, cashflow
            const [searchTerm, setSearchTerm] = useState('');

            // Core Data States
            const [orders, setOrders] = useState(INITIAL_ORDERS);
            const [inventory, setInventory] = useState(INITIAL_INVENTORY);
            const [techs, setTechs] = useState(INITIAL_TECHS);
            const [cashflow, setCashflow] = useState(INITIAL_CASHFLOW);

            // Modals
            const [showNewOrderModal, setShowNewOrderModal] = useState(false);
            const [printOrder, setPrintOrder] = useState(null);

            // Form Đơn Hàng Mới
            const [newOrder, setNewOrder] = useState({
                customerName: '', phone: '', address: '', gps: '',
                deviceType: 'Máy lạnh', brand: '', issue: '', workContent: '',
                techAssigned: 'Thợ A', laborCost: 0, materialCost: 0, paidAmount: 0, notes: '', warrantyMonths: 3
            });

            // -------------------------------------------------------------
            // TÍNH TOÁN THỐNG KÊ (ADMIN DASHBOARD)
            // -------------------------------------------------------------
            const stats = useMemo(() => {
                const today = "2026-09-15";
                const todayOrders = orders.filter(o => o.date === today);
                
                const todayRevenue = todayOrders.reduce((sum, o) => sum + o.paidAmount, 0);
                const monthRevenue = orders.reduce((sum, o) => sum + o.paidAmount, 0);
                const totalDebt = orders.reduce((sum, o) => sum + o.debtAmount, 0);
                const totalExpenses = cashflow.filter(c => c.type === 'CHI').reduce((sum, c) => sum + c.amount, 0);
                const netProfit = monthRevenue - totalExpenses;

                const pendingOrders = orders.filter(o => o.status !== 'Hoàn thành').length;
                const completedOrders = orders.filter(o => o.status === 'Hoàn thành').length;

                return {
                    todayRevenue,
                    monthRevenue,
                    totalExpenses,
                    netProfit,
                    totalDebt,
                    totalOrders: orders.length,
                    pendingOrders,
                    completedOrders,
                    activeTechs: techs.filter(t => t.status === 'Hoạt động').length
                };
            }, [orders, cashflow, techs]);

            // Filter đơn hàng tìm kiếm
            const filteredOrders = useMemo(() => {
                if (!searchTerm) return orders;
                const term = searchTerm.toLowerCase();
                return orders.filter(o => 
                    o.id.toLowerCase().includes(term) ||
                    o.customerName.toLowerCase().includes(term) ||
                    o.phone.includes(term) ||
                    o.address.toLowerCase().includes(term)
                );
            }, [orders, searchTerm]);

            // Xử lý tạo đơn mới
            const handleCreateOrder = (e) => {
                e.preventDefault();
                const totalAmount = Number(newOrder.laborCost) + Number(newOrder.materialCost);
                const debtAmount = totalAmount - Number(newOrder.paidAmount);
                const newId = `DL${Math.floor(100000 + Math.random() * 900000)}`;

                const createdOrder = {
                    ...newOrder,
                    id: newId,
                    totalAmount,
                    debtAmount,
                    status: 'Đã nhận',
                    date: "2026-09-15",
                    materialsUsed: [],
                    photos: []
                };

                setOrders([createdOrder, ...orders]);
                if (newOrder.paidAmount > 0) {
                    setCashflow([{
                        id: Date.now(),
                        type: 'THU',
                        category: 'Thanh toán đơn hàng',
                        amount: Number(newOrder.paidAmount),
                        date: "2026-09-15",
                        note: `Đơn ${newId} - Khách ${newOrder.customerName}`
                    }, ...cashflow]);
                }

                setShowNewOrderModal(false);
                setNewOrder({
                    customerName: '', phone: '', address: '', gps: '',
                    deviceType: 'Máy lạnh', brand: '', issue: '', workContent: '',
                    techAssigned: 'Thợ A', laborCost: 0, materialCost: 0, paidAmount: 0, notes: '', warrantyMonths: 3
                });
            };

            // Cập nhật trạng thái đơn (Dành cho thợ)
            const handleUpdateStatus = (orderId, newStatus) => {
                setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
            };

            // Thợ trừ vật tư trong kho
            const handleUseMaterial = (orderId, item) => {
                if (item.stock <= 0) {
                    alert("Vật tư này đã hết hàng trong kho!");
                    return;
                }
                // Trừ kho
                setInventory(inventory.map(i => i.id === item.id ? { ...i, stock: i.stock - 1 } : i));
                
                // Cập nhật đơn
                setOrders(orders.map(o => {
                    if (o.id === orderId) {
                        const existingMat = o.materialsUsed.find(m => m.name === item.name);
                        let updatedMats = [];
                        if (existingMat) {
                            updatedMats = o.materialsUsed.map(m => m.name === item.name ? { ...m, qty: m.qty + 1 } : m);
                        } else {
                            updatedMats = [...o.materialsUsed, { name: item.name, qty: 1, price: item.sellPrice }];
                        }
                        const newMaterialCost = o.materialCost + item.sellPrice;
                        const newTotal = o.laborCost + newMaterialCost;
                        return {
                            ...o,
                            materialsUsed: updatedMats,
                            materialCost: newMaterialCost,
                            totalAmount: newTotal,
                            debtAmount: newTotal - o.paidAmount
                        };
                    }
                    return o;
                }));
            };

            return (
                <div class="min-h-screen pb-12">
                    <!-- NAVBAR CHÍNH -->
                    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="text-xl font-extrabold tracking-wide text-blue-400">⚡ QUANG THẮNG SERVICE</span>
                                <span class={`text-xs px-2.5 py-1 rounded-full font-bold ${role === 'admin' ? 'bg-amber-400 text-slate-900' : 'bg-emerald-400 text-slate-900'}`}>
                                    {role === 'admin' ? '👑 ADMIN' : `👨‍🔧 THỢ (${currentTech})`}
                                </span>
                            </div>

                            <!-- MÔ PHỎNG CHUYỂN QUYỀN (DEMO) -->
                            <div class="flex items-center bg-slate-800 p-1 rounded-lg text-xs font-semibold">
                                <button 
                                    onClick={() => setRole('admin')}
                                    class={`px-3 py-1.5 rounded-md transition ${role === 'admin' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                                    Quyền Admin
                                </button>
                                <button 
                                    onClick={() => setRole('tech')}
                                    class={`px-3 py-1.5 rounded-md transition ${role === 'tech' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                                    Quyền Thợ
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- CONTAINER CHÍNH -->
                    <main class="max-w-7xl mx-auto px-4 mt-6">

                        {/* ========================================================================= */}
                        {/* 👑 GIAO DIỆN QUẢN TRỊ ADMIN                                              */}
                        {/* ========================================================================= */}
                        {role === 'admin' && (
                            <div>
                                <!-- THANH TÌM KIẾM TẬP TRUNG -->
                                <div class="mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
                                    <div class="relative w-full md:w-96">
                                        <input 
                                            type="text" 
                                            placeholder="🔎 Tìm nhanh: Tên, SĐT, Mã đơn, Địa chỉ..." 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                        />
                                    </div>
                                    <button 
                                        onClick={() => setShowNewOrderModal(true)}
                                        class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                                        <span>+</span> Tạo Đơn Hàng Mới
                                    </button>
                                </div>

                                <!-- THỐNG KÊ DASHBOARD (STAT CARDS) -->
                                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 mb-6">
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">HÔM NAY</p>
                                        <p class="text-base font-extrabold text-emerald-600 mt-0.5">{stats.todayRevenue.toLocaleString()}đ</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">DOANH THU THÁNG</p>
                                        <p class="text-base font-extrabold text-blue-600 mt-0.5">{stats.monthRevenue.toLocaleString()}đ</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">TỔNG CHI PHÍ</p>
                                        <p class="text-base font-extrabold text-rose-500 mt-0.5">{stats.totalExpenses.toLocaleString()}đ</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">LỢI NHUẬN</p>
                                        <p class="text-base font-extrabold text-indigo-600 mt-0.5">{stats.netProfit.toLocaleString()}đ</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">CÔNG NỢ KHÁCH</p>
                                        <p class="text-base font-extrabold text-amber-600 mt-0.5">{stats.totalDebt.toLocaleString()}đ</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">ĐƠN ĐANG SỬA</p>
                                        <p class="text-base font-extrabold text-sky-600 mt-0.5">{stats.pendingOrders} đơn</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">ĐÃ HOÀN THÀNH</p>
                                        <p class="text-base font-extrabold text-emerald-700 mt-0.5">{stats.completedOrders} đơn</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-[11px] font-bold text-gray-400">THỢ HOẠT ĐỘNG</p>
                                        <p class="text-base font-extrabold text-purple-600 mt-0.5">{stats.activeTechs} thợ</p>
                                    </div>
                                </div>

                                <!-- THANH TAB CHỨC NĂNG ADMIN -->
                                <div class="flex overflow-x-auto border-b border-gray-200 mb-6 space-x-6 text-sm font-bold no-scrollbar">
                                    <button onClick={() => setAdminTab('orders')} class={`pb-3 whitespace-nowrap ${adminTab === 'orders' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>📋 Quản Lý Đơn Hàng</button>
                                    <button onClick={() => setAdminTab('techs')} class={`pb-3 whitespace-nowrap ${adminTab === 'techs' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>👨‍🔧 Thợ & Hoa Hồng</button>
                                    <button onClick={() => setAdminTab('inventory')} class={`pb-3 whitespace-nowrap ${adminTab === 'inventory' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>📦 Kho Vật Tư</button>
                                    <button onClick={() => setAdminTab('debts')} class={`pb-3 whitespace-nowrap ${adminTab === 'debts' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>💳 Quản Lý Công Nợ</button>
                                    <button onClick={() => setAdminTab('cashflow')} class={`pb-3 whitespace-nowrap ${adminTab === 'cashflow' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>💸 Sổ Thu - Chi</button>
                                </div>

                                {/* TAB 1: DANH SÁCH ĐƠN HÀNG */}
                                {adminTab === 'orders' && (
                                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                        <div class="overflow-x-auto">
                                            <table class="w-full text-left text-sm">
                                                <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 font-bold">
                                                    <tr>
                                                        <th class="p-3">Mã đơn</th>
                                                        <th class="p-3">Khách hàng / SĐT</th>
                                                        <th class="p-3">Thiết bị & Mô tả lỗi</th>
                                                        <th class="p-3">Thợ phụ trách</th>
                                                        <th class="p-3">Trạng thái</th>
                                                        <th class="p-3">Tiền công / Vật tư</th>
                                                        <th class="p-3">Tổng cộng</th>
                                                        <th class="p-3">Thanh toán</th>
                                                        <th class="p-3 text-center">Thao tác</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-gray-100">
                                                    {filteredOrders.map(order => (
                                                        <tr key={order.id} class="hover:bg-gray-50">
                                                            <td class="p-3 font-bold text-blue-600">{order.id}</td>
                                                            <td class="p-3">
                                                                <p class="font-bold text-gray-900">{order.customerName}</p>
                                                                <p class="text-xs text-blue-600 font-semibold">{order.phone}</p>
                                                                <p class="text-xs text-gray-500">{order.address}</p>
                                                                {order.gps && (
                                                                    <a href={`https://maps.google.com/?q=${order.gps}`} target="_blank" class="text-[11px] text-emerald-600 font-bold underline">
                                                                        📍 Vị trí GPS
                                                                    </a>
                                                                )}
                                                            </td>
                                                            <td class="p-3">
                                                                <span class="bg-slate-100 text-slate-800 text-xs px-2 py-0.5 rounded font-bold">{order.deviceType}</span>
                                                                <p class="text-xs text-gray-700 mt-1 font-medium">{order.issue}</p>
                                                            </td>
                                                            <td class="p-3 font-semibold text-indigo-700">{order.techAssigned}</td>
                                                            <td class="p-3">
                                                                <span class={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                                                    order.status === 'Hoàn thành' ? 'bg-emerald-100 text-emerald-800' :
                                                                    order.status === 'Đang sửa' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
                                                                }`}>
                                                                    {order.status}
                                                                </span>
                                                            </td>
                                                            <td class="p-3 text-xs">
                                                                <p>Công: <strong>{order.laborCost.toLocaleString()}đ</strong></p>
                                                                <p>Vật tư: <strong>{order.materialCost.toLocaleString()}đ</strong></p>
                                                            </td>
                                                            <td class="p-3 font-bold text-gray-900">{order.totalAmount.toLocaleString()}đ</td>
                                                            <td class="p-3">
                                                                {order.debtAmount > 0 ? (
                                                                    <span class="text-xs bg-rose-50 text-rose-600 font-bold px-2 py-1 rounded">Nợ: {order.debtAmount.toLocaleString()}đ</span>
                                                                ) : (
                                                                    <span class="text-xs bg-emerald-50 text-emerald-600 font-bold px-2 py-1 rounded">Đã đủ</span>
                                                                )}
                                                            </td>
                                                            <td class="p-3 text-center">
                                                                <button 
                                                                    onClick={() => setPrintOrder(order)}
                                                                    class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs px-2.5 py-1.5 rounded-lg font-bold border">
                                                                    🧾 In phiếu
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {/* TAB 2: QUẢN LÝ THỢ & TÍNH HOA HỒNG */}
                                {adminTab === 'techs' && (
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {techs.map(tech => {
                                            const techOrders = orders.filter(o => o.techAssigned === tech.name);
                                            const totalLabor = techOrders.reduce((sum, o) => sum + o.laborCost, 0);
                                            const commission = (totalLabor * tech.commissionRate) / 100;

                                            return (
                                                <div key={tech.id} class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-3">
                                                    <div class="flex justify-between items-center border-b pb-3">
                                                        <div>
                                                            <h3 class="font-bold text-lg">{tech.name}</h3>
                                                            <p class="text-xs text-gray-500">SĐT: {tech.phone} | User: {tech.username}</p>
                                                        </div>
                                                        <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">{tech.status}</span>
                                                    </div>

                                                    <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-3 rounded-lg border">
                                                        <div>
                                                            <p class="text-gray-500">% Hoa hồng:</p>
                                                            <p class="font-bold text-base text-gray-800">{tech.commissionRate}%</p>
                                                        </div>
                                                        <div>
                                                            <p class="text-gray-500">Tổng tiền công sửa:</p>
                                                            <p class="font-bold text-base text-gray-800">{totalLabor.toLocaleString()}đ</p>
                                                        </div>
                                                    </div>

                                                    <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg">
                                                        <p class="text-xs text-blue-700 font-semibold">💰 Tiền hoa hồng thợ được hưởng:</p>
                                                        <p class="text-xl font-extrabold text-blue-700">{commission.toLocaleString()}đ</p>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* TAB 3: QUẢN LÝ KHO VẬT TƯ */}
                                {adminTab === 'inventory' && (
                                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                        <h3 class="font-bold text-base mb-4">Danh Sách Vật Tư Điện Lạnh Trong Kho</h3>
                                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                            {inventory.map(item => (
                                                <div key={item.id} class="border p-4 rounded-xl bg-gray-50 space-y-2">
                                                    <div class="flex justify-between items-start">
                                                        <h4 class="font-bold text-gray-900">{item.name}</h4>
                                                        <span class={`text-xs px-2 py-0.5 rounded font-bold ${item.stock <= item.minStock ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                            Tồn: {item.stock} {item.unit}
                                                        </span>
                                                    </div>
                                                    <p class="text-xs text-gray-500">Giá nhập: {item.importPrice.toLocaleString()}đ</p>
                                                    <p class="text-xs font-bold text-blue-600">Giá bán: {item.sellPrice.toLocaleString()}đ / {item.unit}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 4: CÔNG NỢ KHÁCH HÀNG */}
                                {adminTab === 'debts' && (
                                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                        <h3 class="font-bold text-base mb-4 text-rose-600">Danh Sách Khách Hàng Còn Nợ Tiền</h3>
                                        <div class="space-y-3">
                                            {orders.filter(o => o.debtAmount > 0).map(order => (
                                                <div key={order.id} class="flex justify-between items-center p-3 border rounded-lg bg-rose-50/30">
                                                    <div>
                                                        <p class="font-bold text-gray-900">{order.customerName} - {order.phone}</p>
                                                        <p class="text-xs text-gray-500">{order.address} (Đơn {order.id})</p>
                                                    </div>
                                                    <div class="text-right">
                                                        <p class="text-sm font-extrabold text-rose-600">Còn nợ: {order.debtAmount.toLocaleString()}đ</p>
                                                        <p class="text-xs text-gray-400">Tổng đơn: {order.totalAmount.toLocaleString()}đ</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 5: SỔ THU CHI */}
                                {adminTab === 'cashflow' && (
                                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                        <h3 class="font-bold text-base mb-4">Lịch Sử Giao Dịch Thu - Chi</h3>
                                        <div class="space-y-2">
                                            {cashflow.map(cf => (
                                                <div key={cf.id} class="flex justify-between items-center p-3 border-b text-sm">
                                                    <div>
                                                        <span class={`text-xs px-2 py-0.5 rounded font-bold ${cf.type === 'THU' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                            {cf.type}
                                                        </span>
                                                        <span class="font-bold ml-2">{cf.category}</span>
                                                        <p class="text-xs text-gray-500 mt-0.5">{cf.note} ({cf.date})</p>
                                                    </div>
                                                    <span class={`font-extrabold ${cf.type === 'THU' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                        {cf.type === 'THU' ? '+' : '-'}{cf.amount.toLocaleString()}đ
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ========================================================================= */}
                        {/* 👨‍🔧 GIAO DIỆN BẢO MẬT DÀNH CHO THỢ KỸ THUẬT                               */}
                        {/* ========================================================================= */}
                        {role === 'tech' && (
                            <div class="max-w-lg mx-auto space-y-4">
                                <div class="bg-slate-900 text-white p-4 rounded-xl shadow-md flex justify-between items-center">
                                    <div>
                                        <p class="text-xs text-slate-400">Tài khoản thợ:</p>
                                        <h2 class="font-extrabold text-lg text-blue-400">{currentTech}</h2>
                                    </div>
                                    <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500 px-2.5 py-1 rounded-full font-bold">Lịch làm hôm nay</span>
                                </div>

                                {orders.filter(o => o.techAssigned === currentTech).map(order => (
                                    <div key={order.id} class="bg-white p-5 rounded-xl shadow-md border border-gray-200 space-y-4">
                                        <div class="flex justify-between items-start border-b pb-3">
                                            <div>
                                                <span class="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded">{order.id}</span>
                                                <h3 class="font-bold text-lg text-gray-900 mt-1">{order.customerName}</h3>
                                                <a href={`tel:${order.phone}`} class="text-sm font-bold text-blue-600 underline">📞 {order.phone}</a>
                                            </div>
                                            <span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold">{order.status}</span>
                                        </div>

                                        <div class="text-xs text-gray-700 space-y-1.5 bg-gray-50 p-3 rounded-lg border">
                                            <p>📍 <strong>Địa chỉ:</strong> {order.address}</p>
                                            <p>❄️ <strong>Thiết bị:</strong> {order.deviceType} ({order.brand})</p>
                                            <p>🛠️ <strong>Lỗi mô tả:</strong> <span class="text-rose-600 font-semibold">{order.issue}</span></p>
                                            <p>📝 <strong>Ghi chú Admin:</strong> {order.notes}</p>
                                        </div>

                                        <!-- MỞ GOOGLE MAPS GPS -->
                                        {order.gps && (
                                            <a href={`https://maps.google.com/?q=${order.gps}`} target="_blank" class="block text-center bg-slate-800 text-white text-xs py-2.5 rounded-lg font-bold shadow">
                                                📍 Mở vị trí GPS nhà khách trên bản đồ
                                            </a>
                                        )}

                                        <!-- CẬP NHẬT TRẠNG THÁI -->
                                        <div>
                                            <p class="text-xs font-bold text-gray-500 mb-2">Cập nhật trạng thái công việc:</p>
                                            <div class="grid grid-cols-3 gap-1.5 text-xs font-bold">
                                                <button onClick={() => handleUpdateStatus(order.id, 'Đang di chuyển')} class="bg-sky-500 hover:bg-sky-600 text-white py-2 rounded-lg">
                                                    Đang đi
                                                </button>
                                                <button onClick={() => handleUpdateStatus(order.id, 'Đang sửa')} class="bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg">
                                                    Đang sửa
                                                </button>
                                                <button onClick={() => handleUpdateStatus(order.id, 'Hoàn thành')} class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg">
                                                    Hoàn thành
                                                </button>
                                            </div>
                                        </div>

                                        <!-- CHỌN VẬT TƯ TRỪ KHO AUTO -->
                                        <div class="border-t pt-3">
                                            <p class="text-xs font-bold text-gray-500 mb-1">Sử dụng vật tư từ kho (Giảm kho tự động):</p>
                                            <div class="flex flex-wrap gap-1 mb-2">
                                                {order.materialsUsed.map((m, idx) => (
                                                    <span key={idx} class="text-[11px] bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded border border-blue-200">
                                                        {m.name} (x{m.qty})
                                                    </span>
                                                ))}
                                            </div>
                                            <div class="flex flex-wrap gap-1">
                                                {inventory.map(item => (
                                                    <button 
                                                        key={item.id} 
                                                        onClick={() => handleUseMaterial(order.id, item)}
                                                        class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold px-2 py-1 rounded border">
                                                        + {item.name} (Tồn: {item.stock})
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <!-- HÌNH ẢNH DỰ ÁN -->
                                        <div class="border-t pt-3 flex justify-between items-center text-xs">
                                            <span class="font-semibold text-gray-500">📷 Ảnh hiện trường (0)</span>
                                            <button class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1 rounded font-bold border">
                                                + Chụp / Tải ảnh lên
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                    </main>

                    {/* ========================================================================= */}
                    {/* MODAL TẠO ĐƠN HÀNG MỚI (ADMIN)                                            */}
                    {/* ========================================================================= */}
                    {showNewOrderModal && (
                        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div class="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 my-8 shadow-2xl">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="font-extrabold text-lg">Tạo Đơn Hàng Sửa Chữa Mới</h3>
                                    <button onClick={() => setShowNewOrderModal(false)} class="text-gray-400 text-xl font-bold">✕</button>
                                </div>

                                <form onSubmit={handleCreateOrder} class="space-y-3 text-sm">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="font-bold text-xs">Tên khách hàng *</label>
                                            <input required type="text" class="w-full border p-2 rounded-lg mt-1" value={newOrder.customerName} onChange={e => setNewOrder({...newOrder, customerName: e.target.value})} placeholder="Nguyễn Văn A"/>
                                        </div>
                                        <div>
                                            <label class="font-bold text-xs">Số điện thoại *</label>
                                            <input required type="text" class="w-full border p-2 rounded-lg mt-1" value={newOrder.phone} onChange={e => setNewOrder({...newOrder, phone: e.target.value})} placeholder="0961450862"/>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="font-bold text-xs">Địa chỉ nhà khách *</label>
                                        <input required type="text" class="w-full border p-2 rounded-lg mt-1" value={newOrder.address} onChange={e => setNewOrder({...newOrder, address: e.target.value})} placeholder="Cát Hưng, Phù Cát"/>
                                    </div>

                                    <div>
                                        <label class="font-bold text-xs">Tọa độ GPS (Lat, Lng)</label>
                                        <input type="text" class="w-full border p-2 rounded-lg mt-1" value={newOrder.gps} onChange={e => setNewOrder({...newOrder, gps: e.target.value})} placeholder="13.9281, 109.0521"/>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="font-bold text-xs">Loại thiết bị</label>
                                            <select class="w-full border p-2 rounded-lg mt-1" value={newOrder.deviceType} onChange={e => setNewOrder({...newOrder, deviceType: e.target.value})}>
                                                <option>Máy lạnh</option>
                                                <option>Máy giặt</option>
                                                <option>Tủ lạnh</option>
                                                <option>Tủ mát</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="font-bold text-xs">Hãng & Model</label>
                                            <input type="text" class="w-full border p-2 rounded-lg mt-1" value={newOrder.brand} onChange={e => setNewOrder({...newOrder, brand: e.target.value})} placeholder="Panasonic 1.5HP"/>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="font-bold text-xs">Mô tả lỗi của máy</label>
                                        <input type="text" class="w-full border p-2 rounded-lg mt-1" value={newOrder.issue} onChange={e => setNewOrder({...newOrder, issue: e.target.value})} placeholder="Không lạnh, xì gas, báo lỗi..."/>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="font-bold text-xs">Phân công thợ</label>
                                            <select class="w-full border p-2 rounded-lg mt-1" value={newOrder.techAssigned} onChange={e => setNewOrder({...newOrder, techAssigned: e.target.value})}>
                                                {techs.map(t => <option key={t.id}>{t.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label class="font-bold text-xs">Tiền công (đ)</label>
                                            <input type="number" class="w-full border p-2 rounded-lg mt-1" value={newOrder.laborCost} onChange={e => setNewOrder({...newOrder, laborCost: e.target.value})}/>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="font-bold text-xs">Tiền vật tư ước tính (đ)</label>
                                            <input type="number" class="w-full border p-2 rounded-lg mt-1" value={newOrder.materialCost} onChange={e => setNewOrder({...newOrder, materialCost: e.target.value})}/>
                                        </div>
                                        <div>
                                            <label class="font-bold text-xs">Khách đã thanh toán (đ)</label>
                                            <input type="number" class="w-full border p-2 rounded-lg mt-1" value={newOrder.paidAmount} onChange={e => setNewOrder({...newOrder, paidAmount: e.target.value})}/>
                                        </div>
                                    </div>

                                    <div class="flex justify-end gap-2 pt-4 border-t">
                                        <button type="button" onClick={() => setShowNewOrderModal(false)} class="px-4 py-2 border rounded-lg font-bold">Hủy</button>
                                        <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-bold shadow">Lưu & Tạo đơn</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ========================================================================= */}
                    {/* MODAL IN PHIẾU THU & PHIẾU BẢO HÀNH                                       */}
                    {/* ========================================================================= */}
                    {printOrder && (
                        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <div id="printable-area" class="space-y-4 border p-4 rounded-lg bg-white">
                                    <div class="text-center border-b pb-3">
                                        <h2 class="font-extrabold text-lg">⚡ QUANG THẮNG SERVICE</h2>
                                        <p class="text-xs text-gray-500">Chuyên Sửa Chữa Điện Lạnh - Phù Cát</p>
                                        <p class="text-xs font-bold text-blue-600">Hotline: 0961.450.862</p>
                                    </div>

                                    <div class="text-xs space-y-1">
                                        <p><strong>Mã đơn:</strong> {printOrder.id}</p>
                                        <p><strong>Khách hàng:</strong> {printOrder.customerName}</p>
                                        <p><strong>SĐT:</strong> {printOrder.phone}</p>
                                        <p><strong>Địa chỉ:</strong> {printOrder.address}</p>
                                        <p><strong>Thiết bị:</strong> {printOrder.deviceType} ({printOrder.brand})</p>
                                    </div>

                                    <div class="border-t border-b py-2 text-xs space-y-1">
                                        <p><strong>Nội dung sửa:</strong> {printOrder.workContent || printOrder.issue}</p>
                                        <p><strong>Tiền công:</strong> {printOrder.laborCost.toLocaleString()}đ</p>
                                        <p><strong>Tiền vật tư:</strong> {printOrder.materialCost.toLocaleString()}đ</p>
                                        <p class="text-sm font-bold pt-1">TỔNG CỘNG: {printOrder.totalAmount.toLocaleString()}đ</p>
                                        <p class="text-xs font-semibold text-emerald-600">Đã thanh toán: {printOrder.paidAmount.toLocaleString()}đ</p>
                                    </div>

                                    <div class="text-[11px] text-gray-500 text-center italic">
                                        Bảo hành dịch vụ: {printOrder.warrantyMonths} tháng.<br/>
                                        Cảm ơn quý khách đã tin tưởng dịch vụ!
                                    </div>
                                </div>

                                <div class="flex justify-end gap-2">
                                    <button onClick={() => setPrintOrder(null)} class="px-4 py-2 border rounded-lg text-xs font-bold">Đóng</button>
                                    <button onClick={() => window.print()} class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow">In ngay</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
