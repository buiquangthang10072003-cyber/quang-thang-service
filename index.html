<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANG THẮNG SERVICE - Quản Lý Điện Lạnh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // Role State: 'admin' hoặc 'tech'
            const [role, setRole] = useState('admin');
            const [activeTab, setActiveTab] = useState('orders');

            // Sample State Data
            const [orders, setOrders] = useState([
                {
                    id: "DL000125",
                    customerName: "Nguyễn Văn A",
                    phone: "0961450862",
                    address: "Cát Hưng, Phù Cát",
                    gps: "13.9281, 109.0521",
                    deviceType: "Máy lạnh",
                    brand: "Panasonic 1.5 HP",
                    issue: "Máy không lạnh, xì gas",
                    techAssigned: "Thợ A",
                    status: "Đang sửa", // Đã nhận, Đang di chuyển, Đang sửa, Hoàn thành
                    laborCost: 300000,
                    materialCost: 150000,
                    total: 450000,
                    paid: 450000,
                    debt: 0,
                    date: "15/09/2026",
                    materialsUsed: ["Gas R32 (1)"],
                    photos: ["https://via.placeholder.com/150"]
                },
                {
                    id: "DL000126",
                    customerName: "Trần Thị B",
                    phone: "0988123456",
                    address: "TT. Ngô Mây, Phù Cát",
                    gps: "13.9500, 109.0333",
                    deviceType: "Máy giặt",
                    brand: "Toshiba 9Kg",
                    issue: "Lồng giặt không quay, báo lỗi E10",
                    techAssigned: "Thợ B",
                    status: "Đã nhận",
                    laborCost: 250000,
                    materialCost: 0,
                    total: 250000,
                    paid: 0,
                    debt: 250000,
                    date: "15/09/2026",
                    materialsUsed: [],
                    photos: []
                }
            ]);

            const [inventory, setInventory] = useState([
                { id: 1, name: "Gas R32", unit: "Kg", stock: 15, minStock: 5, price: 150000 },
                { id: 2, name: "Tụ điện 35uF", unit: "Cái", stock: 8, minStock: 3, price: 80000 },
                { id: 3, name: "Ống đồng 10/6", unit: "Mét", stock: 50, minStock: 10, price: 120000 },
            ]);

            const [techs, setTechs] = useState([
                { id: 1, name: "Thợ A", phone: "0911222333", commission: 30, status: "Đang hoạt động" },
                { id: 2, name: "Thợ B", phone: "0944555666", commission: 35, status: "Đang hoạt động" },
            ]);

            // Trạng thái Đơn hàng cho Thợ cập nhật
            const updateOrderStatus = (orderId, newStatus) => {
                setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
            };

            // Thợ chọn vật tư làm giảm kho
            const useInventoryItem = (orderId, itemId) => {
                const item = inventory.find(i => i.id === itemId);
                if (item && item.stock > 0) {
                    setInventory(inventory.map(i => i.id === itemId ? { ...i, stock: i.stock - 1 } : i));
                    setOrders(orders.map(o => {
                        if (o.id === orderId) {
                            return {
                                ...o,
                                materialsUsed: [...o.materialsUsed, `${item.name} (1)`],
                                materialCost: o.materialCost + item.price,
                                total: o.total + item.price
                            };
                        }
                        return o;
                    }));
                }
            };

            return (
                <div class="pb-12">
                    <!-- Top Navigation Bar -->
                    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="text-xl font-bold text-blue-400">📱 QUANG THẮNG SERVICE</span>
                                <span class={`text-xs px-2.5 py-1 rounded-full font-semibold ${role === 'admin' ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950'}`}>
                                    {role === 'admin' ? '👑 ADMIN' : '👨‍🔧 THỢ KỸ THUẬT'}
                                </span>
                            </div>

                            <!-- Role Switcher (Dành cho bản Demo testing) -->
                            <div class="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700">
                                <button 
                                    onClick={() => { setRole('admin'); setActiveTab('orders'); }}
                                    class={`px-3 py-1 text-sm font-medium rounded-md transition ${role === 'admin' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                                    Chế độ Admin
                                </button>
                                <button 
                                    onClick={() => { setRole('tech'); setActiveTab('my_orders'); }}
                                    class={`px-3 py-1 text-sm font-medium rounded-md transition ${role === 'tech' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                                    Chế độ Thợ
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Main Container -->
                    <main class="max-w-7xl mx-auto px-4 mt-6">

                        {/* ========================================================= */}
                        {/* 1. VIEW DÀNH CHO ADMIN                                   */}
                        {/* ========================================================= */}
                        {role === 'admin' && (
                            <div>
                                <!-- Stat Dashboard -->
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <p class="text-xs font-semibold text-gray-500">💰 Doanh Thu Hôm Nay</p>
                                        <p class="text-xl font-bold text-emerald-600 mt-1">700.000đ</p>
                                    </div>
                                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <p class="text-xs font-semibold text-gray-500">📈 Lợi Nhuận Tháng</p>
                                        <p class="text-xl font-bold text-blue-600 mt-1">18.500.000đ</p>
                                    </div>
                                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <p class="text-xs font-semibold text-gray-500">💳 Công Nợ Khách</p>
                                        <p class="text-xl font-bold text-rose-600 mt-1">250.000đ</p>
                                    </div>
                                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <p class="text-xs font-semibold text-gray-500">🔧 Đơn Đang Xử Lý</p>
                                        <p class="text-xl font-bold text-amber-600 mt-1">2 đơn</p>
                                    </div>
                                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <p class="text-xs font-semibold text-gray-500">👨‍🔧 Thợ Hoạt Động</p>
                                        <p class="text-xl font-bold text-indigo-600 mt-1">2 thợ</p>
                                    </div>
                                </div>

                                <!-- Admin Tabs -->
                                <div class="flex border-b border-gray-200 mb-6 space-x-6">
                                    <button onClick={() => setActiveTab('orders')} class={`pb-3 font-semibold text-sm ${activeTab === 'orders' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>📋 Quản Lý Đơn Hàng</button>
                                    <button onClick={() => setActiveTab('techs')} class={`pb-3 font-semibold text-sm ${activeTab === 'techs' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>👨‍🔧 Thợ & Hoa Hồng</button>
                                    <button onClick={() => setActiveTab('inventory')} class={`pb-3 font-semibold text-sm ${activeTab === 'inventory' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>📦 Quản Lý Kho Vật Tư</button>
                                </div>

                                {/* TAB 1: DANH SÁCH ĐƠN HÀNG (ADMIN) */}
                                {activeTab === 'orders' && (
                                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <div class="flex justify-between items-center mb-6">
                                            <h2 class="text-lg font-bold">Danh Sách Đơn Hàng Dịch Vụ</h2>
                                            <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition">
                                                + Tạo Đơn Hàng Mới
                                            </button>
                                        </div>

                                        <div class="overflow-x-auto">
                                            <table class="w-full text-left text-sm">
                                                <thead class="bg-gray-50 border-b border-gray-200 text-gray-600">
                                                    <tr>
                                                        <th class="p-3">Mã đơn</th>
                                                        <th class="p-3">Khách hàng / SĐT</th>
                                                        <th class="p-3">Thiết bị & Lỗi</th>
                                                        <th class="p-3">Vị trí GPS</th>
                                                        <th class="p-3">Thợ phân công</th>
                                                        <th class="p-3">Trạng thái</th>
                                                        <th class="p-3">Tổng tiền</th>
                                                        <th class="p-3">Thanh toán</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-gray-100">
                                                    {orders.map((o) => (
                                                        <tr key={o.id} class="hover:bg-gray-50">
                                                            <td class="p-3 font-bold text-blue-600">{o.id}</td>
                                                            <td class="p-3">
                                                                <div class="font-semibold">{o.customerName}</div>
                                                                <div class="text-xs text-gray-500">{o.phone}</div>
                                                                <div class="text-xs text-gray-400">{o.address}</div>
                                                            </td>
                                                            <td class="p-3">
                                                                <span class="font-medium bg-gray-100 text-gray-800 px-2 py-0.5 rounded text-xs">{o.deviceType}</span>
                                                                <p class="text-xs text-gray-600 mt-1">{o.issue}</p>
                                                            </td>
                                                            <td class="p-3">
                                                                <a href={`https://maps.google.com/?q=${o.gps}`} target="_blank" class="text-xs text-blue-600 underline flex items-center gap-1">
                                                                    📍 Ghim GPS
                                                                </a>
                                                            </td>
                                                            <td class="p-3 font-medium text-indigo-700">{o.techAssigned}</td>
                                                            <td class="p-3">
                                                                <span class={`px-2.5 py-1 rounded-full text-xs font-semibold ${
                                                                    o.status === 'Hoàn thành' ? 'bg-emerald-100 text-emerald-800' :
                                                                    o.status === 'Đang sửa' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
                                                                }`}>
                                                                    {o.status}
                                                                </span>
                                                            </td>
                                                            <td class="p-3 font-bold">{o.total.toLocaleString()}đ</td>
                                                            <td class="p-3">
                                                                {o.debt > 0 ? (
                                                                    <span class="text-xs text-rose-600 font-semibold bg-rose-50 px-2 py-1 rounded">Nợ: {o.debt.toLocaleString()}đ</span>
                                                                ) : (
                                                                    <span class="text-xs text-emerald-600 font-semibold bg-emerald-50 px-2 py-1 rounded">Đã đủ</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {/* TAB 2: THỢ & HOA HỒNG (ADMIN ONLY) */}
                                {activeTab === 'techs' && (
                                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <h2 class="text-lg font-bold mb-4">Quản Lý Thợ & Tính Hoa Hồng</h2>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {techs.map(t => {
                                                // Tính hoa hồng mẫu cho Thợ A
                                                const totalLabor = orders.filter(o => o.techAssigned === t.name).reduce((sum, o) => sum + o.laborCost, 0);
                                                const commissionAmount = (totalLabor * t.commission) / 100;
                                                return (
                                                    <div key={t.id} class="border border-gray-200 p-4 rounded-xl bg-gray-50">
                                                        <div class="flex justify-between items-center">
                                                            <h3 class="font-bold text-gray-900 text-lg">{t.name} ({t.phone})</h3>
                                                            <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2 py-1 rounded">{t.status}</span>
                                                        </div>
                                                        <div class="mt-3 space-y-1 text-sm">
                                                            <p class="text-gray-600">% Hoa hồng cài đặt: <strong class="text-gray-800">{t.commission}%</strong></p>
                                                            <p class="text-gray-600">Tổng tiền công sửa: <strong class="text-gray-800">{totalLabor.toLocaleString()}đ</strong></p>
                                                            <p class="text-blue-700 font-bold text-base mt-2">
                                                                💰 Hoa hồng thợ nhận được: {commissionAmount.toLocaleString()}đ
                                                            </p>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 3: KHO VẬT TƯ (ADMIN) */}
                                {activeTab === 'inventory' && (
                                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <h2 class="text-lg font-bold mb-4">Tồn Kho Vật Tư Điện Lạnh</h2>
                                        <div class="space-y-3">
                                            {inventory.map(item => (
                                                <div key={item.id} class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                    <div>
                                                        <p class="font-bold text-gray-800">{item.name}</p>
                                                        <p class="text-xs text-gray-500">Giá bán: {item.price.toLocaleString()}đ / {item.unit}</p>
                                                    </div>
                                                    <div>
                                                        <span class={`font-bold px-3 py-1 rounded-full text-sm ${item.stock <= item.minStock ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                            Tồn: {item.stock} {item.unit}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* 2. VIEW DÀNH CHO THỢ (BẢO MẬT PHÂN QUYỀN HOÀN TOÀN)      */}
                        {/* ========================================================= */}
                        {role === 'tech' && (
                            <div class="max-w-md mx-auto space-y-4">
                                <div class="bg-blue-900 text-white p-4 rounded-xl shadow">
                                    <h2 class="font-bold text-lg">Xin chào, Thợ A 👋</h2>
                                    <p class="text-xs text-blue-200">Danh sách đơn hàng được Admin giao hôm nay</p>
                                </div>

                                {orders.filter(o => o.techAssigned === "Thợ A").map(order => (
                                    <div key={order.id} class="bg-white p-5 rounded-xl shadow-md border border-gray-200 space-y-3">
                                        <div class="flex justify-between items-start border-b pb-2">
                                            <div>
                                                <span class="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded">{order.id}</span>
                                                <h3 class="font-bold text-lg text-gray-900 mt-1">{order.customerName}</h3>
                                                <p class="text-sm font-medium text-blue-600">{order.phone}</p>
                                            </div>
                                            <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">{order.status}</span>
                                        </div>

                                        <div class="text-sm text-gray-600 space-y-1">
                                            <p>📍 <strong>Địa chỉ:</strong> {order.address}</p>
                                            <p>❄️ <strong>Thiết bị:</strong> {order.deviceType} ({order.brand})</p>
                                            <p>🛠️ <strong>Mô tả lỗi:</strong> <span class="text-rose-600">{order.issue}</span></p>
                                        </div>

                                        <!-- Ghim Vị trí GPS -->
                                        <a href={`https://maps.google.com/?q=${order.gps}`} target="_blank" class="block text-center bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs py-2 rounded-lg font-semibold">
                                            📍 Mở vị trí GPS bản đồ nhà khách
                                        </a>

                                        <!-- Cập nhật trạng thái công việc -->
                                        <div class="pt-2">
                                            <p class="text-xs font-semibold text-gray-500 mb-2">Cập nhật tiến độ:</p>
                                            <div class="grid grid-cols-3 gap-1 text-xs">
                                                <button onClick={() => updateOrderStatus(order.id, 'Đang di chuyển')} class="bg-sky-500 hover:bg-sky-600 text-white py-1.5 rounded font-medium">
                                                    Đang đi
                                                </button>
                                                <button onClick={() => updateOrderStatus(order.id, 'Đang sửa')} class="bg-amber-500 hover:bg-amber-600 text-white py-1.5 rounded font-medium">
                                                    Đang sửa
                                                </button>
                                                <button onClick={() => updateOrderStatus(order.id, 'Hoàn thành')} class="bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded font-medium">
                                                    Xong
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Trừ Kho Vật Tư Từ Điện Thoại Thợ -->
                                        <div class="pt-2 border-t">
                                            <p class="text-xs font-semibold text-gray-500 mb-1">Vật tư đã dùng cho đơn:</p>
                                            <div class="flex flex-wrap gap-1 mb-2">
                                                {order.materialsUsed.map((m, idx) => (
                                                    <span key={idx} class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded border">{m}</span>
                                                ))}
                                            </div>
                                            <div class="flex gap-2">
                                                <button onClick={() => useInventoryItem(order.id, 1)} class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-1 rounded">
                                                    + Dùng Gas R32 (-1)
                                                </button>
                                                <button onClick={() => useInventoryItem(order.id, 2)} class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-1 rounded">
                                                    + Dùng Tụ 35uF (-1)
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Chụp & Upload Ảnh -->
                                        <div class="pt-2 border-t flex justify-between items-center text-xs text-gray-500">
                                            <span>📷 Ảnh chụp công việc (0)</span>
                                            <button class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-2.5 py-1 rounded font-medium">
                                                + Tải ảnh lên
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
